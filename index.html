<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd0f2">
  <meta name="description" content="Empire Tycoon : bâtis ton empire avec 6 entreprises reliées entre elles.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Empire Tycoon">
  <title>Empire Tycoon</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="hrow">
      <div class="lvl" aria-label="Niveau"><b id="hLvl">1</b><div class="xp"><i id="hXp"></i></div></div>
      <div class="cash">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffc928" stroke="#23314d" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#c98a00" stroke-width="2"/></svg>
        <b id="hMoney">0 €</b>
      </div>
      <button class="gems" data-a="nav" data-s="shop" aria-label="Diamants">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l5 6-10 12L2 9z" fill="#36c5e6" stroke="#23314d" stroke-width="2" stroke-linejoin="round"/><path d="M2 9h20M9 3l3 6 3-6M12 9v12" fill="none" stroke="#23314d" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <b id="hGems">0</b>
      </button>
    </div>
    <div class="hrow2"><span id="hDay">Jour 1</span><span id="hEv"></span></div>
  </header>

  <main id="main"></main>

  <nav id="nav">
    <button data-a="nav" data-s="home" class="on">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 14 16 5l11 9v13H5z" fill="#ffd25e"/><path d="M5 14 16 5l11 9v13H5z M12 27v-8h8v8" fill="none" stroke="#23314d" stroke-width="2.4" stroke-linejoin="round"/><path d="M3 15 16 4l13 11" fill="none" stroke="#e8583d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Empire</button>
    <button data-a="nav" data-s="stock">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="10" width="22" height="17" rx="2" fill="#d99a5b" stroke="#23314d" stroke-width="2.4"/><path d="M5 10l3-5h16l3 5M5 16h22M16 10v6" fill="none" stroke="#23314d" stroke-width="2.4" stroke-linejoin="round"/></svg>
      Stock</button>
    <button data-a="nav" data-s="quests">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 5v23" stroke="#23314d" stroke-width="2.6" stroke-linecap="round"/><path d="M9 6h16l-4 5 4 5H9z" fill="#4fbf5a" stroke="#23314d" stroke-width="2.4" stroke-linejoin="round"/></svg>
      Missions<i class="badge" id="qBadge"></i></button>
    <button data-a="nav" data-s="shop">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 5h12l6 8-12 15L4 13z" fill="#36c5e6" stroke="#23314d" stroke-width="2.4" stroke-linejoin="round"/><path d="M4 13h24M12 5l4 8 4-8M16 13v15" fill="none" stroke="#23314d" stroke-width="2" stroke-linejoin="round"/></svg>
      Boosts<i class="badge dotb" id="sBadge">!</i></button>
    <button data-a="nav" data-s="more">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9h20M6 16h20M6 23h20" stroke="#23314d" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="9" r="3.4" fill="#ffd25e" stroke="#23314d" stroke-width="2.2"/><circle cx="21" cy="16" r="3.4" fill="#e8583d" stroke="#23314d" stroke-width="2.2"/><circle cx="10" cy="23" r="3.4" fill="#36c5e6" stroke="#23314d" stroke-width="2.2"/></svg>
      Plus</button>
  </nav>

  <div id="modal"><div class="mbox"></div></div>
  <div id="toasts"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
