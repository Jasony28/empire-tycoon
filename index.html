<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1222">
  <meta name="description" content="Empire Tycoon : bâtis ton empire avec 6 entreprises reliées entre elles.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Empire Tycoon">
  <title>Empire Tycoon</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud">
    <div class="hrow">
      <div class="lvl"><b id="hLvl">1</b><div class="xp"><i id="hXp"></i></div></div>
      <div class="cash"><span>💰</span><b id="hMoney">0 €</b></div>
      <button class="gems" data-a="nav" data-s="shop">💎 <b id="hGems">0</b></button>
    </div>
    <div class="hrow2"><span id="hSun">☀️</span><span id="hDay">Jour 1</span><span id="hEv"></span></div>
  </header>

  <main id="main"></main>

  <nav id="nav">
    <button data-a="nav" data-s="home" class="on"><span>🏢</span>Empire</button>
    <button data-a="nav" data-s="stock"><span>📦</span>Stock</button>
    <button data-a="nav" data-s="quests"><span>🎯</span>Missions<i class="badge" id="qBadge"></i></button>
    <button data-a="nav" data-s="shop"><span>💎</span>Boosts<i class="badge dotb" id="sBadge">!</i></button>
    <button data-a="nav" data-s="more"><span>⚙️</span>Plus</button>
  </nav>

  <div id="modal"><div class="mbox"></div></div>
  <div id="toasts"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
